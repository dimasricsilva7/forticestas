name: Deploy FortiCestas to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy main to persistent VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate deployment secrets and configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure o GitHub Actions Secret $name antes de executar o deploy."
              exit 1
            fi
          done
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "SSH preparado."

      - name: Deploy and verify application
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          ssh -p "$PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR="$HOME/forticestas"

          if [ ! -d "$APP_DIR/.git" ]; then
            git clone https://github.com/dimasricsilva7/forticestas.git "$APP_DIR"
          fi

          cd "$APP_DIR"
          if [ ! -f .env ]; then
            echo "Arquivo .env ausente. Configure as variáveis de produção no VPS antes do deploy."
            exit 1
          fi

          if docker compose ps --services --status running 2>/dev/null | grep -qx web; then
            sh scripts/backup-data.sh
          fi

          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build

          healthy=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T web node -e "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            docker compose logs --tail=100 web
            echo "Health check da FortiCestas falhou."
            exit 1
          fi

          docker compose ps
          echo "Deploy concluído e health check aprovado."
          REMOTE
